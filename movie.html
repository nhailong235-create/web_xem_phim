<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Galaxy Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="genre.css">
    <link rel="stylesheet" href="movie.css">
</head>
<body>
    <!-- NAVBAR -->
     <div class="navbar navbar-expand-lg px-3">
          <a href="#" class="navbar-brand text-white d-flex align-items-center">
               <img src="logo.png" width="100">
               Galaxy<span class="text-purple">Movie</span>
          </a>
          <ul class="navbar-nav">
               <li class="nav-item"><a href="#" class="nav-link text-white">Trang chủ</a></li>
               <li class="nav-item"><a href="#" class="nav-link text-white">Phim lẻ</a></li>
               <li class="nav-item"><a href="#" class="nav-link text-white">Phim bộ</a></li>
               <li class="nav-item"><a href="genre.html" class="nav-link text-white">Thể loại</a></li>
               <li class="nav-item"><a href="#" class="nav-link text-white">Top IMDb</a></li>
          </ul>
          <form class="ms-auto px-2 d-flex align-items-center position-relative">
               <i class="bi bi-search position-absolute ms-2 text-secondary"></i>
               <input class="form-control form-control-sm ps-4" type="text" placeholder="Tìm kiếm phim...">
          </form>
          <button class="icon-btn"><i class="bi bi-bell-fill"></i></button>
          <div class="user-dropdown-wrapper">
          <button class="icon-btn ms-2" id="user-btn" onclick="toggleUserMenu()">
               <i class="bi bi-person-circle"></i>
          </button>
          <div class="user-menu" id="user-menu">
               <div class="user-menu-header">
                    <p>Chào mừng bạn đến với</p>
                    <strong style="color:#fff; font-size:15px">Galaxy<span style="color:#a78bfa">Movie</span></strong>
               </div>
               <button class="user-menu-item login" onclick="openLogin()">
                    <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
               </button>
               <button class="user-menu-item register" onclick="openRegister()">
                    <i class="bi bi-person-plus"></i> Đăng ký
               </button>
               <div class="user-menu-divider"></div>
               <a href="#" class="user-menu-item">
                    <i class="bi bi-heart"></i> Danh sách yêu thích
               </a>
               <a href="#" class="user-menu-item">
                    <i class="bi bi-clock-history"></i> Lịch sử xem
               </a>
               <a href="#" class="user-menu-item">
                    <i class="bi bi-gear"></i> Cài đặt
               </a>
          </div>
          </div>
               </div>
          <div class="movie-container">
                <img id="movie-img" >
                <div class="movie-content">
                <h1 id="movie-title"></h1>
                <p id="movie-desc"></p>
                <button class="btn btn-purple">Xem phim</button>
                <button class="btn btn-outline-light">+ Yêu Thích</button>
          </div>
                <button class="nutxemphim">
                     <i class="bi bi-play-circle"></i>
                </button>
          </div>
          <div class="movie-details">

    <div class="movie-info-card">

        <h2>Thông tin phim</h2>

        <div class="movie-meta">

            <span class="badge imdb">
                ⭐ <span id="movie-imdb"></span>
            </span>

            <span class="badge views">
                👁 <span id="movie-views"></span>
            </span>

            <span class="badge episodes">
                🎬 <span id="movie-episodes"></span> tập
            </span>

        </div>

        <p id="movie-full-desc"></p>

    </div>

    <div class="episode-section">

        <h2>Danh sách tập</h2>

        <div
            class="episode-list"
            id="episode-list">
        </div>

    </div>

</div>
       <script src="script.js"></script>
       <script src="movie.js"></script>
       
</body>
</html>
