<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thể Loại</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="genre.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="genre.js"></script>
</head>
<body>
     <div class="navbar navbar-expand-lg px-3">
          <a href="index.html" class="navbar-brand text-white d-flex align-items-center">
               <img src="logo.png" width="100" alt="Logo">
               Galaxy<span class="text-purple">Movie</span>
          </a>
          <ul class="navbar-nav">
               <li class="nav-item"><a href="index.html" class="nav-link text-white">Trang chủ</a></li>
               <li class="nav-item"><a href="#" class="nav-link text-white">Phim lẻ</a></li>
               <li class="nav-item"><a href="#" class="nav-link text-white">Phim bộ</a></li>
               <li class="nav-item"><a href="genre.html" class="nav-link text-white">Thể loại</a></li>
               <li class="nav-item"><a href="#" class="nav-link text-white">Top IMDb</a></li>
          </ul>
          <form class="ms-auto px-2 d-flex align-items-center position-relative">
               <i class="bi bi-search position-absolute ms-2 text-secondary"></i>
               <input class="form-control form-control-sm ps-4" type="text" placeholder="Tìm kiếm phim...">
          </form>
          <button class="icon-btn"><i class="bi bi-bell-fill"></i></button>
          
          <div class="user-dropdown-wrapper">
               <button class="icon-btn ms-2" id="user-btn" onclick="toggleUserMenu()">
                    <i class="bi bi-person-circle"></i>
               </button>
               <div class="user-menu" id="user-menu">
                    <div class="user-menu-header">
                         <p>Chào mừng bạn đến với</p>
                         <strong style="color:#fff; font-size:15px">Galaxy<span style="color:#a78bfa">Movie</span></strong>
                    </div>
                    <button class="user-menu-item login" onclick="openLogin()">
                         <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                    </button>
                    <button class="user-menu-item register" onclick="openRegister()">
                         <i class="bi bi-person-plus"></i> Đăng ký
                    </button>
                    <div class="user-menu-divider"></div>
                    <a href="#" class="user-menu-item">
                         <i class="bi bi-heart"></i> Danh sách yêu thích
                    </a>
                    <a href="#" class="user-menu-item">
                         <i class="bi bi-clock-history"></i> Lịch sử xem
                    </a>
                    <a href="#" class="user-menu-item">
                         <i class="bi bi-gear"></i> Cài đặt
                    </a>
               </div>
          </div>
     </div> <div class="genre-container">
        <button class="genre-btn" id="Action" onclick="goGenre('hanhdong')">Action</button>
        <button class="genre-btn" id="Sci-Fi" onclick="goGenre('vientuong')">Sci-Fi</button>
        <button class="genre-btn" id="Horror" onclick="goGenre('kinhdi')">Horror</button>
        <button class="genre-btn" id="Comedy" onclick="goGenre('comedy')">Comedy</button>
        <button class="genre-btn" id="Romance" onclick="goGenre('ngontinh')">Romance</button>
        <button class="genre-btn" id="Fantasy" onclick="goGenre('fantasy')">Fantasy</button>
        <button class="genre-btn" id="Animation" onclick="goGenre('anime')">Animation</button>
        <button class="genre-btn" id="Crime" onclick="goGenre('crime')">Crime</button>
        <button class="genre-btn" id="Drama" onclick="goGenre('drama')">Drama</button>
        <button class="genre-btn" id="War" onclick="goGenre('war')">War</button>
        <button class="genre-btn" id="Thriller" onclick="goGenre('thriller')">Thriller</button>
        <button class="genre-btn" id="Adventure" onclick="goGenre('adventure')">Adventure</button>
    </div>
</body>
</html>
