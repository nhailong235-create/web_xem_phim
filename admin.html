<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản trị - Galaxy Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #111827; color: #fff; }
        .sidebar { background-color: #1f2937; min-height: 100vh; }
        .table-dark { --bs-table-bg: #1f2937; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-3">
                <h4 class="text-purple fw-bold mb-4"><i class="bi bi-shield-lock-fill"></i> Admin Panel</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white bg-dark rounded"><i class="bi bi-film"></i> Quản lý phim</a>
                    </li>
                    <li class="nav-item">
                        <a href="index.html" class="nav-link text-secondary"><i class="bi bi-arrow-left-circle"></i> Quay lại Web</a>
                    </li>
                </ul>
            </div>

            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Danh sách quản lý phim</h2>
                    <button class="btn btn-primary" onclick="openAddModal()"><i class="bi bi-plus-circle"></i> Thêm phim mới</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                            <tr>
                                <th style="width: 8%;">ID Phim</th>
                                <th style="width: 12%;">Ảnh bìa</th>
                                <th>Tên Phim</th>
                                <th style="width: 15%;">Thể loại</th>
                                <th style="width: 10%;">Lượt xem</th>
                                <th style="width: 15%; text-align: center;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="admin-movie-table">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade text-dark" id="movieModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="modalTitle">Thêm phim mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="form-movie-id">
                    <div class="mb-3">
                        <label class="form-label">Tên phim</label>
                        <input type="text" class="form-control bg-secondary text-white border-0" id="form-title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Link Ảnh bìa (URL)</label>
                        <input type="text" class="form-control bg-secondary text-white border-0" id="form-img" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Thể loại hệ thống (Type)</label>
                        <select class="form-select bg-secondary text-white border-0" id="form-type">
                            <option value="top20">Phim nổi bật (Top 20)</option>
                            <option value="ngontinh">Phim ngôn tình</option>
                            <option value="hanhdong">Phim hành động</option>
                            <option value="anime">Anime</option>
                            <option value="kinhdi">Phim kinh dị</option>
                            <option value="comedy">Hài kịch</option>
                            <option value="vientuong">Viễn tưởng</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mô tả tóm tắt</label>
                        <textarea class="form-control bg-secondary text-white border-0" id="form-desc" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-header border-secondary justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-success" onclick="saveMovieForm()">Lưu lại</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
